[project]
name = "ov02c10-camera-fix"
version = "0.1.0"
description = "Working camera capture for the OV02C10 / Intel IPU6 sensor on Debian, bypassing the unmaintained libcamera fallback and unavailable proprietary HAL"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
]

[project.scripts]
ov02c10-camera = "ov02c10_camera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ov02c10_camera"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.3.0",
]
